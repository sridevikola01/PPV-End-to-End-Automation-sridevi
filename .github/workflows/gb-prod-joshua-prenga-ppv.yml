name: GB Prod Joshua vs Prenga Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prod-matrix:
    name: ${{ matrix.source }} | ${{ matrix.plan }}
    timeout-minutes: 45
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        source:
          - home-page-get-started
          - landing-page-banner
          - landing-page-dont-miss-live
          - boxing-page-banner
          - boxing-page-bundle
          - boxing-upcoming-fights
          - home-boxing-banner
          - home-boxing-tile
          - home-boxing-upcoming
          - search
          - schedule
          - home-kickboxing-tile
          - home-page-banner
          - home-page-dont-miss
          - home-biggest-fights
        plan:
          - standard_monthly
          - standard_apm
          - ultimate_apm
          - ultimate_upfront

    env:
      CI: 'true'
      HEADLESS: 'true'
      DAZN_REGION: 'GB'
      DAZN_ENV: 'prod'
      PLAN: ${{ matrix.plan }}
      SOURCE: ${{ matrix.source }}
      PPV_CONFIG: 'aj_joshua_prenga.json'
      PAYMENT_METHOD: 'credit_card'
      SWITCH: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium chrome

      - name: Run Web PPV Flow
        run: npx playwright test tests/new_user/newuser.ppv.spec.ts --project=chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-${{ matrix.source }}-${{ matrix.plan }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-prod-${{ matrix.source }}-${{ matrix.plan }}
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 30
