name: Joshua vs Prenga PPV Matrix

on:
  workflow_dispatch:
    inputs:
      DAZN_REGION:
        description: 'DAZN region to validate'
        required: true
        default: 'GB'
        type: choice
        options:
          - GB
          - AU
          - US
          - AE
      DAZN_ENV:
        description: 'Environment to run'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stag
          - all
      PLAN:
        description: 'Plan to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard_monthly
          - standard_apm
          - ultimate_apm
          - ultimate_upfront
      SOURCE:
        description: 'Surfacing point to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - home-page-get-started
          - landing-page-banner
          - landing-page-dont-miss-live
          - boxing-page-banner
          - boxing-page-bundle
          - boxing-upcoming-fights
          - home-boxing-banner
          - home-boxing-tile
          - home-boxing-upcoming
          - search
          - schedule
          - home-kickboxing-tile
          - home-page-banner
          - home-page-dont-miss
          - home-page-live-tv-rail
          - home-page-live-event-rail
          - home-biggest-fights
          - home-page-dazntile

permissions:
  contents: read

jobs:
  prod-matrix:
    name: ${{ matrix.dazn_env }} | ${{ matrix.plan }}
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dazn_env: [stag, prod]
        plan:
          - standard_monthly
          - standard_apm
          - ultimate_apm
          - ultimate_upfront

    # Run this job only if it matches the selected env and plan inputs
    if: |
      (inputs.DAZN_ENV == 'all' || matrix.dazn_env == inputs.DAZN_ENV) &&
      (inputs.PLAN == 'all' || matrix.plan == inputs.PLAN)

    env:
      CI: 'true'
      HEADLESS: 'true'
      DAZN_REGION: ${{ inputs.DAZN_REGION }}
      DAZN_ENV: ${{ matrix.dazn_env }}
      PPV_EVENT: 'aj_joshua_prenga'
      PAYMENT_METHOD: 'credit_card'
      SWITCH: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright
        run: npx playwright --version

      - name: Run Web PPV Flow (4 local workers)
        run: |
          SOURCES_PARAM=""
          if [ "${{ inputs.SOURCE }}" != "all" ]; then
            SOURCES_PARAM="--sources=${{ inputs.SOURCE }}"
          fi
          npx ts-node scripts/run_sharded_tests.ts --plans=${{ matrix.plan }} $SOURCES_PARAM --concurrency=4

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.dazn_env }}-${{ matrix.plan }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dazn_env }}-${{ matrix.plan }}
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 30
