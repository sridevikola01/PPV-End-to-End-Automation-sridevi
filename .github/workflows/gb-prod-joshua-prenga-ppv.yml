name: Joshua vs Prenga PPV Matrix

on:
  workflow_dispatch:
    inputs:
      DAZN_REGION:
        description: 'DAZN region to validate'
        required: true
        default: 'GB'
        type: choice
        options:
          - GB
          - AU
          - US
          - AE
          - BR
      DAZN_ENV:
        description: 'Environment to run'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - stag
          - beta
          - all
      PLAN:
        description: 'Plan to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standard_monthly
          - standard_apm
          - ultimate_apm
          - ultimate_upfront
      SOURCE:
        description: 'Surfacing point to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - boxing-page-banner
          - boxing-page-bundle
          - boxing-upcoming-fights
          - home-biggest-fights
          - home-boxing-banner
          - home-boxing-tile
          - home-boxing-upcoming
          - home-kickboxing-tile
          - home-page-banner
          - home-page-dazntile
          - home-page-dont-miss
          - home-page-get-started
          - landing-page-banner
          - landing-page-dont-miss-live
          - my-account
          - schedule
          - search
      PAYMENT_METHOD:
        description: 'Payment method (only used for stag environment)'
        required: true
        default: 'credit_card'
        type: choice
        options:
          - credit_card
          - gpay

permissions:
  contents: read

jobs:
  setup:
    name: Setup Execution Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          ENVS='["stag", "prod", "beta"]'
          PLANS='["standard_monthly", "standard_apm", "ultimate_apm", "ultimate_upfront"]'
          
          if [ "${{ inputs.DAZN_ENV }}" != "all" ]; then
            ENVS='["${{ inputs.DAZN_ENV }}"]'
          fi
          if [ "${{ inputs.PLAN }}" != "all" ]; then
            PLANS='["${{ inputs.PLAN }}"]'
          fi
          
          MATRIX_JSON="{\"dazn_env\":$ENVS,\"plan\":$PLANS}"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  prod-matrix:
    name: ${{ matrix.dazn_env }} | ${{ matrix.plan }}
    needs: setup
    runs-on: self-hosted
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      CI: 'true'
      HEADLESS: 'true'
      DAZN_REGION: ${{ inputs.DAZN_REGION }}
      DAZN_ENV: ${{ matrix.dazn_env }}
      PPV_EVENT: 'aj_joshua_prenga'
      PAYMENT_METHOD: ${{ matrix.dazn_env == 'stag' && inputs.PAYMENT_METHOD || 'credit_card' }}
      SWITCH: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run Web PPV Flow (4 local workers)
        run: |
          SOURCES_PARAM=""
          if [ "${{ inputs.SOURCE }}" != "all" ]; then
            SOURCES_PARAM="--sources=${{ inputs.SOURCE }}"
          fi
          npx ts-node scripts/run_sharded_tests.ts --plans=${{ matrix.plan }} $SOURCES_PARAM --concurrency=2

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.dazn_env }}-${{ matrix.plan }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dazn_env }}-${{ matrix.plan }}
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 30
