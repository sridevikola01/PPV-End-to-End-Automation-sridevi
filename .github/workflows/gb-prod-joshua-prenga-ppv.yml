name: Joshua vs Prenga PPV Matrix

on:
  workflow_dispatch:
    inputs:
      DAZN_REGION:
        description: 'DAZN region to validate'
        required: true
        default: 'GB'
        type: choice
        options:
          - GB
          - AU
          - US
          - AE

permissions:
  contents: read

jobs:
  prod-matrix:
    name: ${{ matrix.dazn_env }} | ${{ matrix.plan }}
    timeout-minutes: 45
    runs-on:
      - self-hosted
      - macOS
      - ARM64

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dazn_env: [stag, prod]
        plan:
          - standard_monthly
          - standard_apm
          - ultimate_apm
          - ultimate_upfront

    env:
      CI: 'true'
      HEADLESS: 'true'
      DAZN_REGION: ${{ inputs.DAZN_REGION || 'GB' }}
      DAZN_ENV: ${{ matrix.dazn_env }}
      PPV_EVENT: 'aj_joshua_prenga'
      PAYMENT_METHOD: 'credit_card'
      SWITCH: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright
        run: npx playwright --version

      - name: Run Web PPV Flow (4 local workers)
        run: npx ts-node scripts/run_sharded_tests.ts --plans=${{ matrix.plan }} --concurrency=4

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.dazn_env }}-${{ matrix.plan }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.dazn_env }}-${{ matrix.plan }}
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 30
