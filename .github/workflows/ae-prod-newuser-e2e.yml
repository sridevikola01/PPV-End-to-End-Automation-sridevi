name: New User E2E - AE - PROD

on:
  workflow_dispatch:
    inputs:
      PPV_CONFIG:
        description: 'PPV config filename/key'
        required: true
        default: 'aj_joshua_prenga.json'

      PAYMENT_METHOD:
        description: 'Payment method'
        required: true
        default: 'credit_card'
        type: choice
        options:
          - credit_card
          - gpay

      SWITCH:
        description: 'Switch to Ultimate'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  prod:
    name: ${{ matrix.source }} | ${{ matrix.plan }}

    runs-on:
      - self-hosted
      - macOS

    timeout-minutes: 10

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        source:
          - home-page-get-started
          - landing-page-banner
          - landing-page-dont-miss-live
          - boxing-page-banner
          - boxing-page-bundle
          - boxing-upcoming-fights
          - home-page-dazntile
          - boxing-standard-subscription
          - boxing-banner-ultimate
          - boxing-ultimate-subscription
          - boxing-join-the-club
          - home-boxing-banner
          - home-boxing-tile
          - home-boxing-upcoming
          - search
          - schedule
          - home-kickboxing-tile
          - home-page-banner
          - home-page-dont-miss
          - home-biggest-fights

        plan:
          - standard_monthly
          - standard_apm
          - ultimate_apm
          - ultimate_upfront
        exclude:
          - source: boxing-banner-ultimate
            plan: standard_monthly
          - source: boxing-banner-ultimate
            plan: standard_apm
          - source: boxing-ultimate-subscription
            plan: standard_monthly
          - source: boxing-ultimate-subscription
            plan: standard_apm
          - source: boxing-join-the-club
            plan: standard_monthly
          - source: boxing-join-the-club
            plan: standard_apm

    env:
      CI: 'true'
      HEADLESS: 'true'
      DAZN_REGION: AE
      DAZN_ENV: prod
      SOURCE: ${{ matrix.source }}
      PLAN: ${{ matrix.plan }}
      PPV_CONFIG: ${{ inputs.PPV_CONFIG }}
      PAYMENT_METHOD: ${{ inputs.PAYMENT_METHOD }}
      SWITCH: ${{ inputs.SWITCH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Runner
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          hostname

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify Playwright
        run: npx playwright --version

      - name: Run PROD PPV Flow
        run: npx playwright test tests/new_user/newuser.ppv.spec.ts --project=chromium

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.plan }}-${{ github.run_id }}-${{ github.job }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.plan }}-${{ github.run_id }}-${{ github.job }}
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
