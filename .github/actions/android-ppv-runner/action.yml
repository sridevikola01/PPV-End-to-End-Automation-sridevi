name: Run Android PPV journey
description: Runs Android Appium PPV test journeys.
inputs:
  journey:
    description: 'The PPV journey to run (e.g., new-user or existing-user)'
    required: true
runs:
  using: composite
  steps:
    - name: Add Android SDK platform-tools to PATH
      shell: bash
      run: |
        SDK_PATH="${ANDROID_HOME:-$HOME/Library/Android/sdk}/platform-tools"
        if [ -d "$SDK_PATH" ]; then
          echo "$SDK_PATH" >> "$GITHUB_PATH"
        fi
    - shell: bash
      run: npm ci
    - shell: bash
      run: cd appium && npm ci
    - name: Verify assigned Android device and ADB setup
      shell: bash
      run: |
        set -euo pipefail
        export PATH="${ANDROID_HOME:-$HOME/Library/Android/sdk}/platform-tools:$PATH"
        adb start-server
        if [ -z "${DEVICE_SERIAL:-}" ] || ! adb devices | grep -qw "${DEVICE_SERIAL:-nosuchdevice}"; then
          DETECTED_SERIAL=$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')
          if [ -n "$DETECTED_SERIAL" ]; then
            echo "Auto-detected connected Android device: $DETECTED_SERIAL"
            echo "DEVICE_SERIAL=$DETECTED_SERIAL" >> "$GITHUB_ENV"
            export DEVICE_SERIAL="$DETECTED_SERIAL"
          else
            echo "::error::No connected Android device found via ADB."
            exit 1
          fi
        fi
        adb -s "$DEVICE_SERIAL" wait-for-device
        adb -s "$DEVICE_SERIAL" get-state | grep -qx device
    - if: ${{ env.PROFILE != '' }}
      shell: bash
      run: |
        IFS='/' read -r state plan <<< "$PROFILE"
        echo "USER_STATE=$state" >> "$GITHUB_ENV"
        echo "PLAN=$plan" >> "$GITHUB_ENV"
    - shell: bash
      run: |
        cd appium
        if [ "${{ inputs.journey }}" = "new-user" ]; then
          npx wdio run config/wdio.android.conf.ts --spec tests/android/ppv.handoff.spec.ts
        else
          npx wdio run config/wdio.android.conf.ts --spec tests/android/existingusermobile.ppv.spec.ts
        fi
    - name: Store Android test results locally
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        journey="${{ inputs.journey }}"
        report_id="${SOURCE}-${PROFILE:-$PLAN}"
        report_id="$(echo "$report_id" | tr '/ :|*?<>\"' '_' | tr -cd '[:alnum:]_.-')"
        # Keep each journey separate; source/profile identifiers are shared by
        # the sign-in-during-flow and already-signed-in matrices.
        report_name="ppv-android-${journey}-${report_id}"
        reports_root="${PPV_REPORTS_ROOT:-/tmp/ppv-reports}"
        report_dir="${reports_root}/${GITHUB_RUN_ID}/${report_name}"
        mkdir -p "$report_dir"
        found=false
        for source_dir in appium/test-results appium/reports; do
          if [ -e "$source_dir" ]; then
            cp -R "$source_dir" "$report_dir/"
            found=true
          fi
        done
        if [ "$found" = false ]; then
          echo "No Android report folders found for $report_name"
        fi
        echo "Stored Android test results locally at $report_dir"
